<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港之旅 - 智慧旅遊助手 (Pro)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root { --color-blue: #4169E1; }
        .text-royal-blue { color: var(--color-blue); }
        .bg-royal-blue { background-color: var(--color-blue); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .scale-in-center { animation: scale-in-center 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94) both; }
        @keyframes scale-in-center { 
            0% { transform: scale(0.98); opacity: 0; } 
            100% { transform: scale(1); opacity: 1; } 
        }
        
        .nav-shadow { box-shadow: 0 -4px 20px rgba(0,0,0,0.08); }
        .card-transition { transition: all 0.2s ease; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

<div id="app" class="max-w-md mx-auto min-h-screen bg-white shadow-2xl relative pb-28">

    <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-gray-100 p-4">
        <div class="flex justify-between items-end mb-2">
            <div>
                <h1 class="text-2xl font-black text-gray-800 tracking-tight">{{ activeMenuName }}</h1>
                <p v-if="activeTab === 'itinerary'" class="text-[11px] font-bold mt-0.5" :class="tripRange.start ? 'text-gray-400' : 'text-red-500'">
                    <i class="far fa-calendar-alt mr-1"></i>
                    {{ tripRange.start ? `${tripRange.start} ~ ${tripRange.end}` : '尚未設定旅行日期' }}
                </p>
            </div>
            <button @click="isEditMode = !isEditMode" 
                    :class="isEditMode ? 'bg-red-500 text-white shadow-lg shadow-red-200' : 'bg-gray-100 text-gray-600'"
                    class="text-xs px-5 py-2.5 rounded-full font-bold transition-all active:scale-90">
                <i :class="isEditMode ? 'fas fa-check' : 'fas fa-edit'" class="mr-1"></i>
                {{ isEditMode ? '完成' : '編輯' }}
            </button>
        </div>

        <nav v-if="activeTab === 'itinerary'" class="mt-4 scale-in-center">
            <div v-if="tripDates.length > 0" class="flex items-center space-x-2 overflow-x-auto no-scrollbar w-full pb-1">
                <button v-for="(date, index) in tripDates" :key="date.id"
                        @click="activeDateId = date.id"
                        :class="activeDateId === date.id ? 'bg-royal-blue text-white shadow-md shadow-blue-100' : 'bg-gray-50 text-gray-400 border border-gray-100'"
                        class="flex-shrink-0 px-4 py-2.5 rounded-2xl text-xs font-bold transition-all min-w-[75px] text-center">
                    <div class="text-[9px] uppercase opacity-70 mb-0.5">Day {{ index + 1 }}</div>
                    <div class="text-sm tracking-tighter">{{ formatDate(date.fullDate) }}</div>
                </button>
                <button v-if="isEditMode" @click="showRangeModal = true" 
                        class="flex-shrink-0 w-12 h-12 border-2 border-red-400 border-dashed rounded-2xl text-red-500 bg-red-50 active:bg-red-100 transition-colors">
                    <i class="fas fa-calendar-plus"></i>
                </button>
            </div>
            <div v-else @click="isEditMode ? showRangeModal = true : null" 
                 class="w-full h-14 border-2 border-dashed border-gray-200 rounded-2xl flex items-center justify-center text-xs text-gray-400 font-bold bg-gray-50 cursor-pointer">
                {{ isEditMode ? '＋ 點擊此處設定日期範圍' : '請先點擊右上方編輯模式' }}
            </div>
        </nav>
    </header>

    <main class="p-4">
        
        <section v-if="activeTab === 'itinerary'" class="scale-in-center">
            <div v-if="tripDates.length > 0">
                <div v-if="isEditMode" class="mb-6">
                    <button @click="openAddModal" class="w-full py-5 border-2 border-dashed border-gray-200 rounded-[2rem] text-gray-400 text-sm font-bold hover:bg-gray-50 active:bg-gray-100 transition-all">
                        <i class="fas fa-plus-circle mr-2 text-royal-blue"></i>新增行程到 Day {{ currentDayNumber }}
                    </button>
                </div>
                <div v-if="currentItinerary.length > 0" class="space-y-4">
                    <article v-for="item in currentItinerary" :key="item.id" @click="handleItemClick(item)"
                         :class="[getStyles(item.category).border, getStyles(item.category).shadow]"
                         class="p-5 bg-white border border-gray-100 rounded-[2rem] border-l-[8px] flex justify-between items-center card-transition active:scale-[0.97] cursor-pointer shadow-sm">
                        <div class="flex-1 pr-3">
                            <div class="flex items-center space-x-3 mb-1.5">
                                <span class="text-sm font-black text-gray-800"><i class="far fa-clock mr-1 text-royal-blue"></i>{{ item.time }}</span>
                                <span v-if="item.durationHours > 0 || item.durationMinutes > 0" class="text-[10px] bg-gray-100 text-gray-500 px-2 py-0.5 rounded-md font-bold italic">
                                    <i class="fas fa-hourglass-half mr-1 scale-75"></i>{{ item.durationHours }}h {{ item.durationMinutes }}m
                                </span>
                            </div>
                            <h3 class="font-bold text-gray-900 text-lg leading-snug">{{ item.name }}</h3>
                        </div>
                        <div class="flex flex-col items-end space-y-2">
                            <span :class="getStyles(item.category).bg" class="w-20 py-1.5 text-center rounded-xl text-[10px] font-black tracking-wider text-white border shadow-sm uppercase">{{ item.category }}</span>
                            <a :href="'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(item.name)" target="_blank" @click.stop
                               class="w-20 py-1.5 flex items-center justify-center bg-gray-50 text-gray-500 rounded-xl text-[10px] font-bold border border-gray-200 active:bg-gray-200 transition-colors">
                                <i class="fas fa-map-marked-alt mr-1"></i>地圖
                            </a>
                            <button v-if="isEditMode" @click.stop="deleteItem('
